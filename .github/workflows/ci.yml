name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Gemfile.lock 锁 bundler 2.7（要求 Ruby >= 3.2），3.0/3.1 装不上
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: 单元测试（CRuby，中继服务 + SSE）
        run: bundle exec rake

  node:
    name: Node 契约测试（bridge / 面板 / 时间线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: node --test（test/ 下全部 *.mjs，无第三方依赖）
        run: node --test

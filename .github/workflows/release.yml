name: Release

# RubyGems Trusted Publishing（OIDC）——打 v* 标签即在**无任何 secret**
# 的情况下构建并发布 gem（与 citrine 仓同一流程）。
#
# 一次性前置（仓库管理员在 rubygems.org 操作）：
#   Account settings → Trusted Publishers → 注册本仓库
#   （owner: ShiningRay，repo: citrine-devtools，workflow: release.yml，environment: 留空）
on:
  push:
    tags: ["v*"]

jobs:
  gem:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Trusted Publishing（OIDC）必需
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 发布门禁（Ruby 集成 + bridge/面板契约）
        run: |
          bundle exec rake
          node --test
      - name: 构建 gem
        run: gem build citrine-devtools.gemspec
      - name: 附产物到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.gem"
      - name: 发布到 RubyGems（Trusted Publishing）
        uses: rubygems/release-gem@v1

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Citrine DevTools · v1</title>
<style>
  /* 暗色 token 参照 Emerald desktop.html（与其 theme.rb 调色板同源） */
  :root { --bg: #0b0e14; --panel: #11151f; --panel2: #151b28; --line: #232b3b;
          --fg: #c9d4e6; --dim: #7d8aa5; --accent: #4f8cff;
          --ok: #3fb950; --err: #f85149; }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #2a3348 transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a3348; border-radius: 4px; }
  body { margin: 0; background: var(--bg); color: var(--fg); height: 100vh;
         display: flex; flex-direction: column; overflow: hidden;
         font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }

  /* 顶部标题栏：标题 + 连接状态点 + 刷新 */
  #topbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
            background: var(--panel2); border-bottom: 1px solid var(--line); }
  #topbar .title { font-weight: 600; }
  #status { display: flex; align-items: center; gap: 5px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); display: inline-block; }
  .dot.on { background: var(--ok); }
  #refresh { margin-left: auto; }

  /* 标签页 */
  #tabs { display: flex; gap: 2px; padding: 0 6px; background: var(--panel);
          border-bottom: 1px solid var(--line); }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0;
         color: var(--dim); padding: 5px 10px; cursor: pointer; font: inherit; }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); }

  main { flex: 1; overflow: auto; }

  /* 组件树：缩进列表 */
  .tree-line { padding: 2px 8px; white-space: nowrap; }
  .tree-line:hover { background: var(--panel2); }
  .empty { color: var(--dim); padding: 8px 10px; }

  /* 信号列表 */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: normal; color: var(--dim); padding: 4px 8px;
       border-bottom: 1px solid var(--line); background: var(--bg);
       position: sticky; top: 0; }
  td { padding: 2px 8px; border-bottom: 1px solid rgba(35, 43, 59, .5); white-space: nowrap; }
  td.val { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

  /* 依赖图：canvas 渲染区占满标签页剩余空间 */
  #view-graph { height: 100%; }
  #graph { width: 100%; height: 100%; }

  /* 值变化行内闪烁（0.6s） */
  @keyframes flash { from { background: rgba(79, 140, 255, .28); } to { background: transparent; } }
  .flash { animation: flash .6s ease-out; }

  /* Inspector 详情条（选中信号后出现） */
  #inspector { display: flex; align-items: center; gap: 6px; padding: 5px 10px;
               background: var(--panel2); border-bottom: 1px solid var(--line); }
  #inspector[hidden] { display: none; }
  #inspector input { background: var(--bg); color: var(--fg); border: 1px solid var(--line);
                     border-radius: 6px; padding: 2px 8px; font: inherit; width: 200px; }
  #inspector input:focus { outline: none; border-color: var(--accent); }
  #inspector-status.ok { color: var(--ok); }
  #inspector-status.err { color: var(--err); }
  #inspector-status.dim { color: var(--dim); }
  tr.selected td { background: rgba(79, 140, 255, .12); }

  /* Timeline：纵向时间轴（最新在上） */
  #view-timeline { height: 100%; }
  #timeline { height: 100%; overflow: auto; padding: 4px 0; }
  .tl-row { display: flex; gap: 8px; padding: 1px 10px; white-space: nowrap; align-items: baseline; }
  .tl-row:hover { background: var(--panel2); }
  .tl-time { color: var(--dim); }
  .tl-chip { flex: none; min-width: 64px; text-align: center; border-radius: 8px;
             padding: 0 8px; font-size: 11px; border: 1px solid var(--line); }
  .tl-chip-event { color: var(--accent); border-color: var(--accent); }
  .tl-chip-flush { color: var(--ok); border-color: var(--ok); }
  .tl-chip-signal { color: var(--fg); }
  .tl-chip-other { color: var(--dim); }
  .tl-row.tl-event { cursor: pointer; }
  .tl-row.linked { background: rgba(79, 140, 255, .18); } /* event 点击关联高亮的 flush 行 */
</style>
</head>
<body>
  <header id="topbar">
    <span class="title">Citrine DevTools · v1</span>
    <span id="status"><span id="dot" class="dot"></span><span id="status-text">未连接</span></span>
    <button id="refresh" type="button">刷新</button>
  </header>
  <nav id="tabs">
    <button class="tab active" data-tab="tree" type="button">组件树</button>
    <button class="tab" data-tab="signals" type="button">信号列表</button>
    <button class="tab" data-tab="graph" type="button">依赖图</button>
    <button class="tab" data-tab="timeline" type="button">Timeline</button>
  </nav>
  <main>
    <section id="view-tree"><div id="tree"></div></section>
    <section id="view-signals" hidden>
      <div id="inspector" hidden>
        <span>选中 <b id="inspector-sig">#----</b></span>
        <span id="inspector-value" class="val"></span>
        <input id="inspector-input" type="text" spellcheck="false"
               placeholder="新值：数字/布尔/null/JSON/裸字符串">
        <button id="inspector-write" type="button">写入</button>
        <button id="inspector-rerun" type="button">force_rerun</button>
        <span id="inspector-status"></span>
      </div>
      <table>
        <thead>
          <tr><th>sig</th><th>当前值</th><th>写入次数</th><th>最近写入</th><th>订阅数</th><th>runs</th></tr>
        </thead>
        <tbody id="signals-body"></tbody>
      </table>
    </section>
    <section id="view-graph" hidden><div id="graph"></div></section>
    <section id="view-timeline" hidden><div id="timeline"></div></section>
  </main>
  <script src="/vendor/cytoscape.min.js"></script>
  <script src="/panel.js"></script>
</body>
</html>
